<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo Territorial - CFG Lara</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        #map { height: calc(100vh - 64px); width: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen overflow-hidden flex flex-col">

    <!-- HEADER / NAVEGACIÓN -->
    <header class="h-16 bg-slate-900 border-b border-slate-800 px-4 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <span class="text-xl font-black bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                SISTEMA CFG
            </span>
            <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">LARA</span>
        </div>

        <!-- Ciclos de Consulta -->
        <div class="flex items-center gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
            <button onclick="cambiarCiclo('7')" id="btn-ciclo-7" class="px-3 py-1 rounded-lg text-xs font-semibold transition-all">
                7ma Consulta
            </button>
            <button onclick="cambiarCiclo('8')" id="btn-ciclo-8" class="px-3 py-1 rounded-lg text-xs font-semibold transition-all">
                8va Consulta
            </button>
        </div>

        <!-- Usuario / Rol -->
        <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
                <div id="user-display" class="text-xs font-bold text-slate-200">Cargando...</div>
                <div id="role-display" class="text-[10px] text-indigo-400 uppercase tracking-wider font-semibold">...</div>
            </div>
            <button onclick="cerrarSesion()" class="p-2 text-slate-400 hover:text-red-400 transition-colors" title="Cerrar Sesión">
                🚪
            </button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- MAPA -->
        <div id="map" class="flex-1 bg-slate-900"></div>

        <!-- PANEL LATERAL DERECHO -->
        <aside class="w-96 bg-slate-900/95 backdrop-blur-md border-l border-slate-800 flex flex-col h-full z-20 shadow-2xl relative">
            
            <!-- BUSCADOR Y FILTROS -->
            <div class="p-4 border-b border-slate-800 space-y-3">
                <input type="text" id="input-busqueda" oninput="filtrarPorCiclo()" 
                       placeholder="🔍 Buscar comuna, proyecto, código..." 
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500">
                
                <div class="grid grid-cols-2 gap-2">
                    <select id="select-municipio" onchange="filtrarPorCiclo()" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-slate-300 focus:outline-none">
                        <option value="">Todos los Municipios</option>
                    </select>
                    <select id="select-estatus" onchange="filtrarPorCiclo()" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-slate-300 focus:outline-none">
                        <option value="">Todos los Estatus</option>
                        <option value="POR INICIAR">POR INICIAR</option>
                        <option value="EN EJECUCION">EN EJECUCIÓN</option>
                        <option value="FINALIZADO">FINALIZADO</option>
                    </select>
                </div>
            </div>

            <!-- MODULOS EXTRA (EXPORTAR) -->
            <div class="px-4 py-2 border-b border-slate-800">
                <button onclick="exportarDatosCSV()" class="w-full bg-slate-950 hover:bg-slate-800 border border-slate-800 text-emerald-400 font-medium py-2 px-3 rounded-xl text-xs flex justify-between items-center transition-all">
                    <span>📥 Exportar Datos del Ciclo (CSV)</span>
                    <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800/50 px-1.5 py-0.5 rounded">Excel</span>
                </button>
            </div>

            <!-- FICHA DETALLADA / CONTENIDO DE COMUNA -->
            <div id="panel-detalle" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4">
                <div class="h-full flex flex-col items-center justify-center text-center text-slate-500 space-y-2">
                    <span class="text-3xl">🗺️</span>
                    <p class="text-xs">Selecciona un punto en el mapa o busca una comuna para ver sus detalles.</p>
                </div>
            </div>

        </aside>
    </div>

    <!-- MODAL EDITAR CONSEJOS COMUNALES -->
    <div id="modal-ccs" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-sm text-slate-100">👥 Editar Consejos Comunales (Máx. 9)</h3>
                <button onclick="cerrarModalCC()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <form id="form-ccs" onsubmit="guardarCCs(event, comunaSeleccionadaId)" class="p-4 overflow-y-auto custom-scrollbar space-y-3 flex-1">
                <div id="contenedor-inputs-ccs" class="space-y-2">
                    <!-- Dinámico vía JavaScript -->
                </div>
                
                <div class="pt-4 border-t border-slate-800 flex justify-end gap-2">
                    <button type="button" onclick="cerrarModalCC()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs rounded-xl font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs rounded-xl font-medium">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT PRINCIPAL -->
    <script>
        // CONFIGURACIÓN SUPABASE
        const SUPABASE_URL = "https://TU_SUPABASE_URL.supabase.co"; 
        const SUPABASE_KEY = "TU_SUPABASE_ANON_KEY"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ESTADO GLOBAL
        let comunasData = [];
        let cicloActual = '8';
        let usuarioActual = null;
        let rolUsuario = 'Analista';
        let comunaSeleccionadaId = null;
        let map, markersGroup;

        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', async () => {
            initMap();
            await cargarUsuario();
            await cargarComunas();
            actualizarEstiloBotonCiclo();
        });

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([10.0647, -69.3570], 9);
            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                maxZoom: 19
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
        }

        async function cargarUsuario() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                usuarioActual = user;
                document.getElementById('user-display').innerText = user.email.split('@')[0];
                
                // Consultar Rol
                const { data: profile } = await supabaseClient
                    .from('perfiles')
                    .select('rol')
                    .eq('id', user.id)
                    .single();
                
                if (profile) rolUsuario = profile.rol;
                document.getElementById('role-display').innerText = rolUsuario;
            } else {
                document.getElementById('user-display').innerText = "Invitado / Analista";
            }
        }

        async function cargarComunas() {
            try {
                const { data, error } = await supabaseClient.from('comunas').select('*');
                if (error) throw error;

                comunasData = data || [];
                poblarSelectMunicipios();
                filtrarPorCiclo();
            } catch (err) {
                console.error("Error al cargar los datos de comunas:", err);
            }
        }

        function poblarSelectMunicipios() {
            const select = document.getElementById('select-municipio');
            const municipios = [...new Set(comunasData.map(c => c.municipio).filter(Boolean))].sort();
            
            select.innerHTML = '<option value="">Todos los Municipios</option>';
            municipios.forEach(m => {
                select.innerHTML += `<option value="${m}">${m}</option>`;
            });
        }

        function cambiarCiclo(ciclo) {
            cicloActual = ciclo;
            actualizarEstiloBotonCiclo();
            filtrarPorCiclo();
        }

        function actualizarEstiloBotonCiclo() {
            const btn7 = document.getElementById('btn-ciclo-7');
            const btn8 = document.getElementById('btn-ciclo-8');

            if (cicloActual === '7') {
                btn7.className = "px-3 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow";
                btn8.className = "px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white";
            } else {
                btn8.className = "px-3 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow";
                btn7.className = "px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white";
            }
        }

        function filtrarPorCiclo() {
            markersGroup.clearLayers();

            const textoBusqueda = document.getElementById('input-busqueda').value.toLowerCase();
            const munSel = document.getElementById('select-municipio').value;
            const estSel = document.getElementById('select-estatus').value;

            const filtradas = comunasData.filter(c => {
                const coincideCiclo = String(c.consulta || "7") === String(cicloActual);
                const coincideBusqueda = !textoBusqueda || 
                    (c.nombre && c.nombre.toLowerCase().includes(textoBusqueda)) ||
                    (c.codigo && c.codigo.toLowerCase().includes(textoBusqueda)) ||
                    (c.proyectos && c.proyectos.toLowerCase().includes(textoBusqueda));
                const coincideMun = !munSel || c.municipio === munSel;
                const coincideEst = !estSel || c.estatus_proyecto === estSel;

                return coincideCiclo && coincideBusqueda && coincideMun && coincideEst;
            });

            filtradas.forEach(c => {
                if (c.latitud && c.longitud) {
                    let color = "#6366f1"; // Indigo
                    if (c.estatus_proyecto === "FINALIZADO") color = "#10b981"; // Verde
                    if (c.estatus_proyecto === "EN EJECUCION") color = "#f59e0b"; // Ámbar
                    if (c.emblematico) color = "#ec4899"; // Rosa

                    const marker = L.circleMarker([c.latitud, c.longitud], {
                        radius: c.emblematico ? 9 : 6,
                        fillColor: color,
                        color: "#ffffff",
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.8
                    });

                    marker.on('click', () => mostrarFichaComuna(c));
                    markersGroup.addLayer(marker);
                }
            });
        }

        function mostrarFichaComuna(c) {
            comunaSeleccionadaId = c.id;
            const panel = document.getElementById('panel-detalle');
            const ccs = c.consejos_comunales || [];

            const sectores = [
                "Agua", "Electricidad", "Vialidad", "Salud", "Educación", 
                "Productivo", "Infraestructura", "Seguridad", "Servicios"
            ];

            panel.innerHTML = `
                <div class="space-y-4">
                    <!-- CABECERA -->
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] font-mono text-indigo-400 bg-indigo-950 border border-indigo-800/50 px-2 py-0.5 rounded">
                                ${c.codigo || 'SIN CÓDIGO'}
                            </span>
                            <h2 class="text-sm font-bold text-slate-100 mt-1">${c.nombre || 'Sin Nombre'}</h2>
                            <p class="text-[11px] text-slate-400">${c.municipio || ''} - ${c.parroquia || ''}</p>
                        </div>
                        <button onclick="toggleEmblematico('${c.id}')" class="text-base p-1 hover:scale-110 transition-transform" title="Marcar como Emblemático">
                            ${c.emblematico ? '⭐' : '⚪'}
                        </button>
                    </div>

                    <!-- SECTOR DE INVERSIÓN -->
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-2">
                        <label class="text-[10px] text-slate-400 font-medium uppercase tracking-wider block">Sector de Inversión</label>
                        <div class="flex gap-2">
                            <select id="select-sector-ficha" class="flex-1 bg-slate-900 border border-slate-800 text-xs rounded-lg px-2 py-1 text-slate-200">
                                <option value="">Seleccionar Sector...</option>
                                ${sectores.map(s => `<option value="${s}" ${c.sector === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                            <button onclick="guardarSectorInversion('${c.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded-lg text-xs font-medium transition-colors">
                                Guardar
                            </button>
                        </div>
                    </div>

                    <!-- PROYECTO PRINCIPAL -->
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1">
                        <span class="text-[10px] text-slate-400 font-medium uppercase tracking-wider block">Proyecto Aprobado</span>
                        <p class="text-xs text-slate-200">${c.proyectos || 'No registra proyecto'}</p>
                    </div>

                    <!-- AVANCE DE EJECUCIÓN -->
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-3">
                        <span class="text-[10px] text-slate-400 font-medium uppercase tracking-wider block">Monitoreo de Avance</span>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] text-slate-400">Ejecución Física (%)</label>
                                <input type="number" id="input-ejec-fisica" min="0" max="100" value="${c.ejecucion_fisica || 0}" 
                                       class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-100 font-mono mt-1">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400">Ejecución Financiera (%)</label>
                                <input type="number" id="input-ejec-financiera" min="0" max="100" value="${c.ejecucion_financiera || 0}" 
                                       class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-100 font-mono mt-1">
                            </div>
                        </div>

                        <button onclick="guardarEjecucionManual('${c.id}')" class="w-full bg-slate-800 hover:bg-slate-700 text-indigo-300 font-medium py-1.5 rounded-lg text-xs transition-colors">
                            Actualizar Ejecución
                        </button>
                    </div>

                    <!-- CONSEJOS COMUNALES -->
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-xs text-indigo-300">👥 Consejos Comunales (${ccs.length}/9)</span>
                            <button onclick="abrirModalEditarCC('${c.id}')" class="text-[10px] bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded transition-colors">
                                ✏️ Editar CCs
                            </button>
                        </div>

                        <ul class="space-y-1.5 text-xs">
                            ${ccs.length === 0 ? '<li class="text-slate-500 italic text-[11px]">No hay consejos comunales registrados.</li>' : ''}
                            ${ccs.map(cc => `
                                <li class="bg-slate-900 p-2 rounded-lg border border-slate-800/50 flex justify-between items-center">
                                    <span class="text-slate-200 truncate max-w-[180px]">${cc.nombre}</span>
                                    <span class="text-[9px] px-1.5 py-0.5 rounded font-mono ${cc.voceria_estatus === 'VENCIDA' ? 'bg-red-950 text-red-400 border border-red-800/40' : 'bg-emerald-950 text-emerald-400 border border-emerald-800/40'}">
                                        ${cc.voceria_estatus || 'VIGENTE'}
                                    </span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
        }

        // --- FUNCIONES CON PERSISTENCIA EN SUPABASE ---

        async function toggleEmblematico(idComuna) {
            let c = comunasData.find(item => item.id === idComuna || item.codigo === idComuna);
            if (!c) return;

            let nuevoEstado = !c.emblematico;

            try {
                const { error } = await supabaseClient
                    .from('comunas')
                    .update({ emblematico: nuevoEstado })
                    .eq('id', c.id);

                if (error) throw error;

                c.emblematico = nuevoEstado;
                filtrarPorCiclo();
                mostrarFichaComuna(c);
            } catch (err) {
                console.error("Error actualizando emblemático:", err);
                alert("Error al actualizar el estado emblemático en la base de datos.");
            }
        }

        async function guardarSectorInversion(idComuna) {
            let c = comunasData.find(item => item.id === idComuna || item.codigo === idComuna);
            if (!c) return;

            let nuevoSector = document.getElementById('select-sector-ficha').value;

            try {
                const { error } = await supabaseClient
                    .from('comunas')
                    .update({ sector: nuevoSector })
                    .eq('id', c.id);

                if (error) throw error;

                c.sector = nuevoSector;
                filtrarPorCiclo();
                mostrarFichaComuna(c);
                alert(`Sector de inversión actualizado a: "${nuevoSector}".`);
            } catch (err) {
                console.error("Error guardando sector:", err);
                alert("Error al guardar el sector de inversión.");
            }
        }

        async function guardarEjecucionManual(idComuna) {
            let c = comunasData.find(item => item.id === idComuna || item.codigo === idComuna);
            if (!c) return;

            let fis = parseInt(document.getElementById('input-ejec-fisica').value) || 0;
            let fin = parseInt(document.getElementById('input-ejec-financiera').value) || 0;

            fis = Math.min(100, Math.max(0, fis));
            fin = Math.min(100, Math.max(0, fin));

            try {
                const { error } = await supabaseClient
                    .from('comunas')
                    .update({ 
                        ejecucion_fisica: fis, 
                        ejecucion_financiera: fin 
                    })
                    .eq('id', c.id);

                if (error) throw error;

                c.ejecucion_fisica = fis;
                c.ejecucion_financiera = fin;

                filtrarPorCiclo();
                mostrarFichaComuna(c);
                alert(`Ejecución física (${fis}%) y financiera (${fin}%) actualizada con éxito.`);
            } catch (err) {
                console.error("Error guardando ejecución:", err);
                alert("Error al guardar los avances de ejecución.");
            }
        }

        function abrirModalEditarCC(idComuna) {
            comunaSeleccionadaId = idComuna;
            let c = comunasData.find(item => item.id === idComuna || item.codigo === idComuna);
            if (!c) return;

            const contenedor = document.getElementById('contenedor-inputs-ccs');
            const ccs = c.consejos_comunales || [];

            contenedor.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cc = ccs[i] || { nombre: '', voceria_estatus: 'VIGENTE' };
                contenedor.innerHTML += `
                    <div class="flex gap-2 items-center bg-slate-950 p-2 rounded-xl border border-slate-800">
                        <span class="text-xs font-mono text-slate-500 w-4">${i + 1}.</span>
                        <input type="text" id="cc-nombre-${i}" value="${cc.nombre}" placeholder="Nombre del Consejo Comunal" 
                               class="flex-1 bg-slate-900 border border-slate-800 text-xs rounded-lg px-2 py-1.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                        <select id="cc-voceria-${i}" class="bg-slate-900 border border-slate-800 text-xs rounded-lg px-2 py-1.5 text-slate-300">
                            <option value="VIGENTE" ${cc.voceria_estatus === 'VIGENTE' ? 'selected' : ''}>VIGENTE</option>
                            <option value="VENCIDA" ${cc.voceria_estatus === 'VENCIDA' ? 'selected' : ''}>VENCIDA</option>
                        </select>
                    </div>
                `;
            }

            document.getElementById('modal-ccs').classList.remove('hidden');
        }

        function cerrarModalCC() {
            document.getElementById('modal-ccs').classList.add('hidden');
        }

        async function guardarCCs(e, idComuna) {
            e.preventDefault();
            let c = comunasData.find(item => item.id === idComuna || item.codigo === idComuna);
            if (!c) return;

            let nuevosCCs = [];
            for (let i = 0; i < 9; i++) {
                let nom = document.getElementById(`cc-nombre-${i}`).value.trim();
                let voc = document.getElementById(`cc-voceria-${i}`).value;
                if (nom) nuevosCCs.push({ nombre: nom, voceria_estatus: voc });
            }

            try {
                const { error } = await supabaseClient
                    .from('comunas')
                    .update({ consejos_comunales: nuevosCCs })
                    .eq('id', c.id);

                if (error) throw error;

                c.consejos_comunales = nuevosCCs;
                cerrarModalCC();
                mostrarFichaComuna(c);
                alert("¡Consejos comunales y vocerías actualizados con éxito!");
            } catch (err) {
                console.error("Error guardando CCs:", err);
                alert("Error al actualizar los consejos comunales en la base de datos.");
            }
        }

        // --- EXPORTACIÓN A CSV ---

        function exportarDatosCSV() {
            let dataset = comunasData.filter(c => String(c.consulta || "7") === String(cicloActual));

            if (dataset.length === 0) {
                alert("No hay datos disponibles para exportar en este ciclo.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "ID,Codigo,Nombre,Municipio,Parroquia,Sector,Proyecto,Estatus,Ejecucion Fisica (%),Ejecucion Financiera (%),Emblematico\n";

            dataset.forEach(c => {
                let row = [
                    `"${c.id || ''}"`,
                    `"${c.codigo || ''}"`,
                    `"${(c.nombre || '').replace(/"/g, '""')}"`,
                    `"${c.municipio || ''}"`,
                    `"${c.parroquia || ''}"`,
                    `"${c.sector || ''}"`,
                    `"${(c.proyectos || '').replace(/"/g, '""')}"`,
                    `"${c.estatus_proyecto || ''}"`,
                    c.ejecucion_fisica || 0,
                    c.ejecucion_financiera || 0,
                    c.emblematico ? "SI" : "NO"
                ].join(",");
                csvContent += row + "\n";
            });

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `monitoreo_territorial_ciclo_${cicloActual}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }
    </script>
</body>
