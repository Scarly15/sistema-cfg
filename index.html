<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo Territorial | CFG Lara</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #map { height: calc(100vh - 4rem); z-index: 10; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 px-4 z-50 relative">
        <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-md border border-slate-800 p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-8">
                <div class="flex justify-center mb-3">
                    <img src="https://www.cfg.gob.ve/img/logo_cfg.png" alt="Logo CFG" class="h-12 object-contain" onerror="this.style.display='none'">
                </div>
                <span class="bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Consejo Federal de Gobierno</span>
                <h1 class="text-2xl font-bold mt-3 text-white">Monitoreo Territorial Lara</h1>
                <p class="text-xs text-slate-400 mt-1">Centro de Comando de Gestión Comunal</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase mb-2">Usuario</label>
                    <input type="text" id="username" required class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Ingrese su usuario">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase mb-2">Contraseña</label>
                    <input type="password" id="password" required class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg text-sm transition-all shadow-lg shadow-indigo-600/30">
                    Ingresar al Sistema
                </button>
            </form>
            <p id="login-error" class="text-red-400 text-xs text-center mt-4 hidden"></p>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="app-screen" class="hidden h-screen flex flex-col">
        <header class="bg-slate-900 border-b border-slate-800 h-16 flex items-center justify-between px-6 z-30">
            <div class="flex items-center space-x-3">
                <img src="https://www.cfg.gob.ve/img/logo_cfg.png" alt="Logo CFG" class="h-9 object-contain" onerror="this.style.display='none'">
                <div class="bg-indigo-500 w-2.5 h-2.5 rounded-full animate-pulse"></div>
                <span class="font-bold tracking-wide text-sm">CFG LARA <span class="text-indigo-400 font-light">| Sistema de Comando Táctico</span></span>
            </div>

            <!-- SELECTOR DE CONSULTA POPULAR (7ma vs 8va) -->
            <div class="flex items-center space-x-2 bg-slate-950/80 border border-slate-800 px-3 py-1.5 rounded-xl">
                <span class="text-[11px] text-slate-400 uppercase font-semibold">Ciclo:</span>
                <select id="select-ciclo-consulta" onchange="cambiarCicloConsulta(this.value)" class="bg-slate-900 text-indigo-300 text-xs font-bold border border-slate-700 rounded px-2 py-1 focus:outline-none focus:border-indigo-500 cursor-pointer">
                    <option value="7">7ma Consulta (354 Comunas)</option>
                    <option value="8">8va Consulta (369 Comunas)</option>
                </select>
            </div>

            <div class="flex items-center space-x-4">
                <span id="user-display" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-indigo-300"></span>
                <span id="db-status" class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-full">Verificando BD...</span>
                <button onclick="handleLogout()" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
                    Cerrar Sesión
                </button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden relative">
            <aside class="w-80 bg-slate-900/95 border-r border-slate-800 flex flex-col p-4 space-y-4 z-20 overflow-y-auto">
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Buscador Territorial</label>
                    <input type="text" id="buscador-territorial" oninput="filtrarComunas(this.value)" placeholder="Buscar comuna..." class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <div id="resultados-busqueda" class="bg-slate-900 border border-slate-800 rounded-lg max-h-40 overflow-y-auto hidden text-xs divide-y divide-slate-800 shadow-xl"></div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Zoom por Municipio</label>
                    <select id="select-municipio" onchange="zoomMunicipio(this.value)" class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 cursor-pointer">
                        <option value="">Seleccione un Municipio...</option>
                        <option value="Iribarren">Iribarren (Barquisimeto)</option>
                        <option value="Palavecino">Palavecino (Cabudare)</option>
                        <option value="Jiménez">Jiménez (Quíbor)</option>
                        <option value="Morán">Morán (El Tocuyo)</option>
                        <option value="Andrés Eloy Blanco">Andrés Eloy Blanco (Sanare)</option>
                        <option value="Torres">Torres (Carora)</option>
                        <option value="Simón Planas">Simón Planas (Sarare)</option>
                        <option value="Crespo">Crespo (Duaca)</option>
                        <option value="Urdaneta">Urdaneta (Siquisique)</option>
                    </select>
                </div>

                <hr class="border-slate-800 my-1">

                <!-- ESTADÍSTICAS CLICKABLES -->
                <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-3 space-y-3">
                    <div class="flex justify-between items-center text-xs font-semibold text-slate-300">
                        <span id="label-stats-titulo">ESTADÍSTICAS LARA</span>
                        <span id="total-comunas-badge" class="text-indigo-400">0 Comunas</span>
                    </div>
                    <div onclick="mostrarListaFiltro('aldia')" class="cursor-pointer hover:bg-slate-900 p-2 rounded-lg transition-all border border-transparent hover:border-slate-800">
                        <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                            <span>Rendición al Día (Ver lista)</span>
                            <span id="porcentaje-rendicion" class="text-emerald-400 font-bold">0%</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="barra-rendicion" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                    <div onclick="mostrarListaFiltro('vigentes')" class="cursor-pointer hover:bg-slate-900 p-2 rounded-lg transition-all border border-transparent hover:border-slate-800">
                        <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                            <span>CC Vigentes (Ver lista)</span>
                            <span id="porcentaje-cc" class="text-indigo-400 font-bold">0%</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="barra-cc" class="bg-indigo-500 h-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <hr class="border-slate-800 my-1">

                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Filtros Críticos y Alertas</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="filtrarAlerta('morosos')" class="bg-red-500/10 hover:bg-red-500/25 border border-red-500/30 text-red-300 p-2.5 rounded-xl text-left text-xs transition-all cursor-pointer">
                        <div class="font-bold">⚠️ Morosos</div>
                        <div class="text-[10px] text-slate-400">Sin rendir cuentas</div>
                    </button>
                    <button onclick="filtrarAlerta('vencidos')" class="bg-amber-500/10 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 p-2.5 rounded-xl text-left text-xs transition-all cursor-pointer">
                        <div class="font-bold">⏳ CC Vencidos</div>
                        <div class="text-[10px] text-slate-400">Renovación pendiente</div>
                    </button>
                </div>
                
                <!-- ASISTENTE IA Y AUDITORÍA DE SECTORES -->
                <button onclick="abrirResumenIA()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium py-2.5 rounded-xl text-xs shadow-lg transition-all flex items-center justify-center space-x-2 cursor-pointer">
                    <span>✨ Resumen Ejecutivo & Sectores</span>
                </button>

                <button onclick="cargarDatosSupabase()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-xs transition-colors cursor-pointer">
                    🔄 Restablecer Vista Completa
                </button>
            </aside>

            <main class="flex-1 relative">
                <div id="map"></div>
            </main>

            <!-- FICHA COMUNAL / PANEL LATERAL DE DETALLES (Z-INDEX 50 PARA CLICS FLUIDOS) -->
            <div id="ficha-comuna" class="absolute right-0 top-0 h-full w-96 bg-slate-900/98 border-l border-slate-800 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col p-6 overflow-y-auto">
                <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                    <span id="titulo-panel-lateral" class="text-xs font-semibold uppercase tracking-wider text-indigo-400">Ficha Técnica Comunal</span>
                    <button onclick="cerrarFicha()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center transition-colors cursor-pointer">✕</button>
                </div>
                <div id="contenido-ficha" class="py-4 space-y-4 text-sm text-slate-200"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://pmjgcfushafjiqziwtjr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_awAA6RvlPzMoHUyDhMzf_Q_6BFJlgQw';
        
        let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let map;
        let comunasData = [];
        let cicloActual = "7";
        let marcadoresLayer = L.layerGroup();

        const municipiosCoordenadas = {
            "Iribarren": { lat: 10.0678, lng: -69.3474, zoom: 12 },
            "Palavecino": { lat: 10.2435, lng: -69.2631, zoom: 13 },
            "Jiménez": { lat: 9.9791, lng: -69.7854, zoom: 12 },
            "Morán": { lat: 9.8052, lng: -69.7919, zoom: 12 },
            "Andrés Eloy Blanco": { lat: 9.7717, lng: -69.6453, zoom: 13 },
            "Torres": { lat: 10.3308, lng: -70.0805, zoom: 11 },
            "Simón Planas": { lat: 9.8078, lng: -69.0528, zoom: 12 },
            "Crespo": { lat: 10.2797, lng: -69.2153, zoom: 13 },
            "Urdaneta": { lat: 10.6300, lng: -69.4800, zoom: 11 }
        };

        const comunasRespaldo7ma = [
            { 
                codigo: "COM-001",
                nombre: "Comuna Piloto Lara", 
                municipio: "Iribarren", 
                parroquia: "Aguedo Felipe Alvarado",
                lat: 10.0736, lng: -69.3215, 
                cc_vigentes: 10, cc_vencidos: 3,
                rendicion_cuentas: "Al día",
                proyectos: "Rehabilitación Vial e Hidráulica",
                consulta: "7"
            },
            { 
                codigo: "COM-002",
                nombre: "Comuna Hugo Chávez", 
                municipio: "Palavecino", 
                parroquia: "Cabudare",
                lat: 10.2350, lng: -69.2550, 
                cc_vigentes: 2, cc_vencidos: 7,
                rendicion_cuentas: "Moroso",
                proyectos: "Sustitución de colectores y agua potable",
                consulta: "7"
            },
            { 
                codigo: "COM-003",
                nombre: "Comuna Gigantes de Quíbor", 
                municipio: "Jiménez", 
                parroquia: "Catedral",
                lat: 9.9800, lng: -69.7800, 
                cc_vigentes: 8, cc_vencidos: 1,
                rendicion_cuentas: "Al día",
                proyectos: "Agua Potable y Electricidad",
                consulta: "7"
            }
        ];

        const comunasRespaldo8va = [
            { 
                codigo: "COM-101",
                nombre: "Comuna Nueva Era 8va", 
                municipio: "Iribarren", 
                parroquia: "Catedral",
                lat: 10.0800, lng: -69.3500, 
                cc_vigentes: 12, cc_vencidos: 2,
                rendicion_cuentas: "Al día",
                proyectos: "Consolidación de Servicios Públicos y Vialidad",
                consulta: "8"
            }
        ];

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === 'admin_cfg' && pass === 'admin123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-display').innerText = `Usuario: ${user}`;
                initMap();
                cargarDatosSupabase();
            } else {
                const err = document.getElementById('login-error');
                err.innerText = 'Credenciales incorrectas (Use admin_cfg / admin123).';
                err.classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function initMap() {
            if (!map) {
                map = L.map('map').setView([10.0678, -69.3474], 10);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 18, attribution: '&copy; OpenStreetMap & CFG Lara', subdomains: 'abcd'
                }).addTo(map);
                marcadoresLayer.addTo(map);
            }
        }

        async function cargarDatosSupabase() {
            const statusBadge = document.getElementById('db-status');
            try {
                const { data, error } = await supabaseClient.from('comunas').select('*');
                if (error) throw error;
                if (data && data.length > 0) {
                    comunasData = data;
                    statusBadge.className = "text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full";
                    statusBadge.innerText = "BD Conectada";
                } else {
                    throw new Error("Tabla sin registros.");
                }
            } catch (err) {
                console.warn("Usando datos de respaldo locales por ciclo:", err);
                comunasData = [...comunasRespaldo7ma, ...comunasRespaldo8va];
                statusBadge.className = "text-[10px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full";
                statusBadge.innerText = "Modo Respaldo Activo";
            }
            filtrarPorCicloActivo();
        }

        function cambiarCicloConsulta(valor) {
            cicloActual = valor;
            filtrarPorCicloActivo();
        }

        function filtrarPorCicloActivo() {
            let datosFiltrados = comunasData.filter(c => String(c.consulta || "7") === String(cicloActual));
            if (datosFiltrados.length === 0) {
                datosFiltrados = comunasData;
            }
            
            const metaComunas = cicloActual === "7" ? "354 Comunas (7ma)" : "369 Comunas (8va)";
            document.getElementById('total-comunas-badge').innerText = metaComunas;
            document.getElementById('label-stats-titulo').innerText = `ESTADÍSTICAS LARA (${cicloActual}ª CONSULTA)`;

            actualizarEstadisticas(datosFiltrados);
            renderizarComunasEnMapa(datosFiltrados);
        }

        function actualizarEstadisticas(data) {
            const total = data.length;
            if (total === 0) return;

            let alDia = data.filter(c => c.rendicion_cuentas && c.rendicion_cuentas.toLowerCase().includes('día')).length;
            let pRendicion = Math.round((alDia / total) * 100);

            let totalCCVigentes = data.reduce((acc, c) => acc + (Number(c.cc_vigentes) || 0), 0);
            let totalCCVencidos = data.reduce((acc, c) => acc + (Number(c.cc_vencidos) || 0), 0);
            let sumaCC = totalCCVigentes + totalCCVencidos;
            let pCC = sumaCC > 0 ? Math.round((totalCCVigentes / sumaCC) * 100) : 100;

            document.getElementById('porcentaje-rendicion').innerText = `${pRendicion}%`;
            document.getElementById('barra-rendicion').style.width = `${pRendicion}%`;

            document.getElementById('porcentaje-cc').innerText = `${pCC}%`;
            document.getElementById('barra-cc').style.width = `${pCC}%`;
        }

        function renderizarComunasEnMapa(data) {
            marcadoresLayer.clearLayers();
            data.forEach(c => {
                if (c.lat && c.lng) {
                    let markerColor = (Number(c.cc_vencidos) > Number(c.cc_vigentes) || (c.rendicion_cuentas && c.rendicion_cuentas.toLowerCase().includes('moroso'))) ? '#ef4444' : '#6366f1';
                    
                    let customIcon = L.divIcon({
                        className: 'custom-pin',
                        html: `<div style="background-color: ${markerColor}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>`,
                        iconSize: [14, 14]
                    });

                    let marker = L.marker([c.lat, c.lng], { icon: customIcon });
                    
                    marker.on('click', () => {
                        mostrarFichaComuna(c);
                        map.setView([c.lat, c.lng], 13);
                    });
                    
                    marcadoresLayer.addLayer(marker);
                }
            });
        }

        function mostrarFichaComuna(c) {
            document.getElementById('titulo-panel-lateral').innerText = "Ficha Técnica Comunal";
            const panel = document.getElementById('ficha-comuna');
            document.getElementById('contenido-ficha').innerHTML = `
                <div>
                    <h2 class="text-base font-bold text-white mb-1">${c.nombre}</h2>
                    <span class="text-xs bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded border border-indigo-500/20">Código: ${c.codigo || 'S/N'} | ${c.consulta || cicloActual}ª Consulta</span>
                </div>
                <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800 space-y-2 text-xs">
                    <div class="flex justify-between"><span class="text-slate-400">Municipio:</span> <span class="font-medium text-white">${c.municipio || 'N/D'}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Parroquia:</span> <span class="font-medium text-white">${c.parroquia || 'N/D'}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Rendición de Cuentas:</span> <span class="font-bold ${c.rendicion_cuentas && c.rendicion_cuentas.toLowerCase().includes('moroso') ? 'text-red-400' : 'text-emerald-400'}">${c.rendicion_cuentas || 'Al día'}</span></div>
                </div>
                <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800 space-y-2 text-xs">
                    <div class="font-semibold text-indigo-300 mb-1">Consejos Comunales (CC)</div>
                    <div class="flex justify-between"><span class="text-slate-400">Vigentes:</span> <span class="text-emerald-400 font-bold">${c.cc_vigentes || 0}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Vencidos:</span> <span class="text-amber-400 font-bold">${c.cc_vencidos || 0}</span></div>
                </div>
                <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800 space-y-1 text-xs">
                    <div class="font-semibold text-indigo-300">Proyectos / Sectores</div>
                    <p class="text-slate-300">${c.proyectos || 'Sin proyectos registrados.'}</p>
                </div>
            `;
            panel.classList.remove('translate-x-full');
        }

        function mostrarListaFiltro(tipo) {
            let datasetActivo = comunasData.filter(c => String(c.consulta || "7") === String(cicloActual));
            if (datasetActivo.length === 0) datasetActivo = comunasData;

            let lista = [];
            let titulo = "";
            if (tipo === 'aldia') {
                lista = datasetActivo.filter(c => !c.rendicion_cuentas || c.rendicion_cuentas.toLowerCase().includes('día'));
                titulo = `Rendición al Día (${cicloActual}ª Consulta)`;
            } else if (tipo === 'vigentes') {
                lista = datasetActivo.filter(c => (Number(c.cc_vigentes) || 0) >= (Number(c.cc_vencidos) || 0));
                titulo = `Mayoría CC Vigentes (${cicloActual}ª Consulta)`;
            }
            renderizarListaEnPanel(lista, titulo);
        }

        function filtrarAlerta(tipo) {
            let datasetActivo = comunasData.filter(c => String(c.consulta || "7") === String(cicloActual));
            if (datasetActivo.length === 0) datasetActivo = comunasData;

            let lista = [];
            let titulo = "";
            if (tipo === 'morosos') {
                lista = datasetActivo.filter(c => c.rendicion_cuentas && c.rendicion_cuentas.toLowerCase().includes('moroso'));
                titulo = `Alerta: Comunas Morosas`;
            } else if (tipo === 'vencidos') {
                lista = datasetActivo.filter(c => (Number(c.cc_vencidos) || 0) > (Number(c.cc_vigentes) || 0));
                titulo = `Alerta: CC Vencidos`;
            }
            renderizarListaEnPanel(lista, titulo);
        }

        function renderizarListaEnPanel(lista, titulo) {
            document.getElementById('titulo-panel-lateral').innerText = titulo;
            const panel = document.getElementById('ficha-comuna');
            
            let html = `<p class="text-xs text-slate-400 mb-3">Se encontraron <b>${lista.length}</b> registros:</p><div class="space-y-2">`;
            if (lista.length === 0) {
                html += `<p class="text-xs text-slate-500">No hay comunas en este grupo.</p>`;
            } else {
                lista.forEach(c => {
                    html += `
                        <div onclick='seleccionarComunaPorCodigo("${c.codigo}")' class="bg-slate-950/60 border border-slate-800 hover:border-indigo-500 p-3 rounded-xl cursor-pointer transition-all">
                            <div class="font-bold text-white text-xs">${c.nombre}</div>
                            <div class="text-[11px] text-slate-400">Mun: ${c.municipio || 'N/D'} | Vigentes: ${c.cc_vigentes || 0}</div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            document.getElementById('contenido-ficha').innerHTML = html;
            panel.classList.remove('translate-x-full');
        }

        function seleccionarComunaPorCodigo(codigo) {
            let comuna = comunasData.find(c => c.codigo === codigo);
            if (comuna) {
                mostrarFichaComuna(comuna);
                if (comuna.lat && comuna.lng) map.setView([comuna.lat, comuna.lng], 13);
            }
        }

        function abrirResumenIA() {
            document.getElementById('titulo-panel-lateral').innerText = "Análisis de Sectores & IA";
            const panel = document.getElementById('ficha-comuna');
            
            let datasetActivo = comunasData.filter(c => String(c.consulta || "7") === String(cicloActual));
            if (datasetActivo.length === 0) datasetActivo = comunasData;

            let total = datasetActivo.length;
            let alDiaCount = datasetActivo.filter(c => !c.rendicion_cuentas || c.rendicion_cuentas.toLowerCase().includes('día')).length;
            
            document.getElementById('contenido-ficha').innerHTML = `
                <div class="space-y-3 text-xs">
                    <div class="bg-indigo-950/40 border border-indigo-500/30 p-3 rounded-xl text-indigo-200">
                        <b>🤖 Auditoría ${cicloActual}ª Consulta:</b> Monitoreando ${total} comunas vinculadas. ${alDiaCount} comunas se encuentran al día en rendición de cuentas.
                    </div>
                    <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800 space-y-2">
                        <div class="font-bold text-white">Filtrar por Sector Prioritario (Agua, Vialidad, Electricidad...):</div>
                        <input type="text" id="busqueda-sector" oninput="filtrarPorSector(this.value)" placeholder="Escriba sector o proyecto..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white">
                    </div>
                    <div id="resultado-sectores" class="space-y-2 max-h-60 overflow-y-auto">
                        <p class="text-slate-500 text-[11px]">Escriba una palabra clave arriba para listar proyectos por sector.</p>
                    </div>
                </div>
            `;
            panel.classList.remove('translate-x-full');
        }

        function filtrarPorSector(keyword) {
            const contenedor = document.getElementById('resultado-sectores');
            let datasetActivo = comunasData.filter(c => String(c.consulta || "7") === String(cicloActual));
            if (datasetActivo.length === 0) datasetActivo = comunasData;

            if (!keyword) {
                contenedor.innerHTML = `<p class="text-slate-500 text-[11px]">Escriba una palabra clave arriba para listar proyectos por sector.</p>`;
                return;
            }
            let matches = datasetActivo.filter(c => c.proyectos && c.proyectos.toLowerCase().includes(keyword.toLowerCase()));
            if (matches.length === 0) {
                contenedor.innerHTML = `<p class="text-xs text-red-400">No se encontraron proyectos asociados a "${keyword}" en esta consulta.</p>`;
            } else {
                contenedor.innerHTML = matches.map(c => `
                    <div onclick='seleccionarComunaPorCodigo("${c.codigo}")' class="bg-slate-900 p-2 rounded border border-slate-800 cursor-pointer hover:border-indigo-500">
                        <div class="font-bold text-white text-[11px]">${c.nombre}</div>
                        <div class="text-[10px] text-indigo-300">${c.proyectos}</div>
                    </div>
                `).join('');
            }
        }

        function cerrarFicha() { document.getElementById('ficha-comuna').classList.add('translate-x-full'); }
        
        function zoomMunicipio(m) { 
            if (m && municipiosCoordenadas[m]) {
                map.setView([municipiosCoordenadas[m].lat, municipiosCoordenadas[m].lng], municipiosCoordenadas[m].zoom);
            } 
        }

        function filtrarComunas(texto) {
            const contenedor = document.getElementById('resultados-busqueda');
            if (!texto) { contenedor.classList.add('hidden'); return; }
            let coincidencias = comunasData.filter(c => c.nombre.toLowerCase().includes(texto.toLowerCase()));
            if (coincidencias.length > 0) {
                contenedor.innerHTML = coincidencias.map(c => `<div onclick="seleccionarComunaPorCodigo('${c.codigo}')" class="p-2.5 hover:bg-slate-800 cursor-pointer">${c.nombre} (${c.consulta || '7'}ª)</div>`).join('');
                contenedor.classList.remove('hidden');
            } else {
                contenedor.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
